<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOSTanis1d · Терминал Экспериментов</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@300;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0d15;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Orbitron', 'Noto Sans JP', sans-serif;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 200, 0.03) 0%, transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(255, 0, 150, 0.04) 0%, transparent 40%),
                repeating-linear-gradient(45deg, rgba(0, 255, 200, 0.01) 0px, rgba(0, 255, 200, 0.01) 2px, transparent 2px, transparent 6px);
        }

        /* ГЛАВНАЯ КАРТА — как терминал Арены */
        .terminal-card {
            max-width: 820px;
            width: 100%;
            background: #10131f;
            border: 2px solid #2affc0;
            box-shadow: 0 0 40px rgba(42, 255, 192, 0.2), inset 0 0 30px rgba(42, 255, 192, 0.05);
            border-radius: 32px;
            padding: 32px 28px;
            position: relative;
            backdrop-filter: blur(2px);
            transition: 0.3s;
        }

        /* Глитч-линии (аниме-эксперименты) */
        .terminal-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #ff00a2, transparent, #00ffc8, transparent);
            background-size: 300% 300%;
            border-radius: 34px;
            z-index: -1;
            opacity: 0.3;
            animation: glitchBorder 6s infinite alternate;
        }

        @keyframes glitchBorder {
            0% { background-position: 0% 50%; opacity: 0.2; }
            50% { opacity: 0.6; }
            100% { background-position: 100% 50%; opacity: 0.2; }
        }

        /* ХЕДЕР — кибер-шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2affc0;
            padding-bottom: 18px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 28px;
            filter: drop-shadow(0 0 8px #2affc0);
        }

        .logo h1 {
            font-size: 22px;
            font-weight: 900;
            color: #e0fff5;
            text-shadow: 0 0 12px #2affc0, 0 0 30px #00b894;
            letter-spacing: 2px;
        }

        .logo span {
            color: #ff4d9e;
            text-shadow: 0 0 15px #ff4d9e;
        }

        .status-badge {
            background: #1f2638;
            border: 1px solid #ff4d9e;
            color: #ff4d9e;
            padding: 8px 16px;
            border-radius: 60px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(255, 77, 158, 0.3);
            backdrop-filter: blur(4px);
            text-transform: uppercase;
        }

        /* ТАРИФ / ОФЕР — стиль "Твинк" */
        .offer-block {
            background: #141b29;
            border: 1px solid #2affc0;
            border-radius: 24px;
            padding: 24px 20px;
            margin: 20px 0 24px;
            box-shadow: inset 0 0 30px rgba(42, 255, 192, 0.05), 0 8px 0 #0b0f18;
            position: relative;
            overflow: hidden;
        }

        .offer-title {
            font-size: 34px;
            font-weight: 900;
            background: linear-gradient(135deg, #2affc0, #00b4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(42, 255, 192, 0.3);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .offer-title small {
            font-size: 16px;
            background: rgba(255, 77, 158, 0.2);
            -webkit-text-fill-color: #ff4d9e;
            padding: 4px 14px;
            border-radius: 60px;
            border: 1px solid #ff4d9e;
            font-weight: 400;
        }

        .offer-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 20px;
            margin: 20px 0 14px;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #b0d4d0;
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 300;
            font-size: 16px;
        }

        .detail-item strong {
            color: #fff;
            font-weight: 700;
            background: #1e2a3a;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 15px;
            border-left: 2px solid #2affc0;
        }

        .detail-item .highlight {
            color: #ff4d9e;
            font-weight: 700;
            text-shadow: 0 0 10px #ff4d9e;
        }

        .price-tag {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px dashed #2affc0;
            padding-top: 18px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .price {
            font-size: 34px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 30px #2affc0;
        }

        .price span {
            color: #2affc0;
            font-size: 28px;
        }

        .price small {
            font-size: 18px;
            font-weight: 300;
            color: #8ba8a3;
            margin-left: 8px;
        }

        .btn-order {
            background: #ff4d9e;
            border: none;
            padding: 14px 40px;
            border-radius: 60px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 18px;
            color: #0b0d15;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 30px rgba(255, 77, 158, 0.3);
            border: 1px solid #ff4d9e;
            text-transform: uppercase;
        }

        .btn-order:hover {
            transform: scale(1.02);
            background: #ff2b8a;
            box-shadow: 0 0 60px #ff4d9e;
        }

        /* ССЫЛКА НА Midasbuy */
        .midas-section {
            background: #0f1420;
            border-radius: 20px;
            padding: 18px 20px;
            margin: 20px 0 18px;
            border: 1px solid #2a3a4a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
        }

        .midas-section a {
            color: #2affc0;
            font-weight: 700;
            text-decoration: none;
            border-bottom: 2px dotted #2affc0;
            padding-bottom: 2px;
            word-break: break-all;
            font-size: 15px;
        }

        .midas-section a:hover {
            color: #fff;
            border-bottom: 2px solid #ff4d9e;
        }

        .badge-hk {
            background: #1f2a3a;
            padding: 6px 16px;
            border-radius: 60px;
            color: #ffb347;
            font-size: 13px;
            border: 1px solid #ffb347;
            letter-spacing: 1px;
        }

        /* КОНТАКТ / ЗАКАЗ */
        .contact-line {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 24px;
            margin-top: 20px;
            border-top: 1px solid #1f2a3a;
            padding-top: 18px;
            flex-wrap: wrap;
        }

        .contact-line .tg {
            background: #1f2638;
            padding: 10px 24px;
            border-radius: 60px;
            border: 1px solid #2affc0;
            color: #fff;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
            text-decoration: none;
        }

        .contact-line .tg:hover {
            background: #2affc0;
            color: #0b0d15;
            box-shadow: 0 0 40px #2affc0;
            border-color: #0b0d15;
        }

        .contact-line .tg i {
            font-style: normal;
            font-size: 20px;
        }

        /* аниме-акценты (эксперименты) */
        .anime-glitch {
            position: relative;
            display: inline-block;
        }

        .anime-glitch::after {
            content: '⍟';
            color: #ff4d9e;
            font-size: 16px;
            margin-left: 6px;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.2; }
            50% { opacity: 1; text-shadow: 0 0 20px #ff4d9e; }
            100% { opacity: 0.2; }
        }

        /* адаптив */
        @media (max-width: 600px) {
            .terminal-card { padding: 20px 16px; }
            .offer-title { font-size: 26px; }
            .offer-details { grid-template-columns: 1fr; gap: 8px; }
            .price { font-size: 28px; }
            .btn-order { width: 100%; text-align: center; justify-content: center; }
            .header { flex-direction: column; align-items: flex-start; gap: 12px; }
            .contact-line { justify-content: center; }
        }

        /* скролл-бар */
        ::-webkit-scrollbar { width: 6px; background: #0b0d15; }
        ::-webkit-scrollbar-thumb { background: #2affc0; border-radius: 10px; }

        /* доп глитч-текст */
        .glitch-text {
            color: #b0ffea;
            font-size: 14px;
            letter-spacing: 3px;
            opacity: 0.5;
            font-weight: 300;
        }
    </style>
</head>

</body>
</html>
